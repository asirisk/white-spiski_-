name: Sync VPN Configs from igareck
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Download BLACK_VLESS_RUS.txt
        run: curl -sL https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt -o BLACK_VLESS_RUS.txt
      
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add BLACK_VLESS_RUS.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync: $(date +%Y-%m-%d_%H:%M)" && git push)